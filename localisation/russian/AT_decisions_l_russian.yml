 negotiations_with_kingdom: "Переговоры с: [FROM.GetName]"
 negotiations_with_kingdom_desc: "[FROM.GetName] должны уже наконец понять, что шуткам пришёл конец. Мы ответственно заявляем, что браку быть и этот брак скрепит наши державы вечными узами"

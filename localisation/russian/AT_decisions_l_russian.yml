 negotiations_with_kingdom_category: "Дела сердечные"
 negotiations_with_kingdom_category_desc: "Для счастливой жизни снежному королю не хватает только того, кто мог бы понять и полюбить его. Кого-то, кто составил бы компанию одинокому королю в этом грубом и разгневанном мире. \n\n§YЕсли вы играете с длс La Resistance, вам доступны миссии на захват принцесс в агентстве. В случае успеха операции, разблокируются дальнейшие решения.§!"

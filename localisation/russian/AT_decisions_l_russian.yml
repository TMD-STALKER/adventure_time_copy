 state_goal_flag: "Намечена цель"
 state_goal: "Наметить цель: [FROM.GetName]"
 state_goal_desc: "[FROM.GetName] - место, которое должно оказаться под нашим контролем в ближайшее время. Обязательно."
 state_goal_mission: "§HЗахват цели - [FROM.GetName]§!"
 state_goal_mission_desc: "Сейчас только от нас самих зависит то, оправдаем ли мы ожидания народа!"
 decript_goal: "Дешифровать цель - [FROM.GetName]"
 decript_goal_desc: "Мы должны узнать все тайны, которые скрываются [FROM.GetName]"
 decript_goal_mission: "§HДешифровка цели - [FROM.GetName]§!"
 decript_goal_mission_desc: "Сейчас только от нас самих зависит то, оправдаем ли мы ожидания народа!"
 we_need_capture_this: "Должно оказаться под нашим контролем за 50 дней."
 we_need_decript_this: "Разведагентство должно вскрыть шифр за 150 дней."
 capture_items: "Захват предметов"
 capture_items_desc: "Есть три способа получения предметов для своего лидера. §YКонфискация у марионетки§! - тут всё понятно. §YНахождение в конкретном регионе§! - если вы удерживаете территорию, в которой хранится предмет, вы можете за определённую сумму провести там раскопки и добыть свой артефакт. §YПобеда над врагом§! - Когда враг капитулирует хотя бы на 85%, а у вас будет как минимум 30% вклада в войну, вы сможете захватить его предметы прямо во время войны."
 at_start_border_war: "Начать войну за [FROM.GetName]"
 at_start_border_war_desc: "Сейчас или никогда. [FROM.GetName] и [ROOT.Capital.GetName] должны стать одним целым, если не из экономических или политических соображений, то хотя бы исходя из здравого смысла. Эта территория всегда должна была быть нашей!"
 main_solution_tt: "Когда поддержка какой-либо из оппозиционных партий достигнет 50%, эффект изменится."
 united_build: "Совместная постройка фабрик"
 united_build_desc: "Наша промышленность, это и их промышленность. Они знают, что им же от этого будет выгоднее, потому уговорить хозяев на такую авантюру будет проще простого."
 united_build2: "Совместная постройка военных заводов"
 united_build2_desc: "Наша промышленность, это и их промышленность. Они знают, что им же от этого будет выгоднее, потому уговорить хозяев на такую авантюру будет проще простого."
 united_build3: "Совместная постройка верфей"
 united_build3_desc: "Наша промышленность, это и их промышленность. Они знают, что им же от этого будет выгоднее, потому уговорить хозяев на такую авантюру будет проще простого."
 united_build_tt: "После выполнения решения оно будет недоступно ещё 150 дней."
 prepare_collab_decision: "Связаться с коллаборационистами в: [FROM.GetName]"
 prepare_collab_decision_desc: "[FROM.GetName] будет на нашей стороне, если мы заранее об этом договоримся."
 go_collab_decision: "Пора, [FROM.GetName]!"
 go_collab_decision_desc: "Сейчас или никогда. Без поддержки мы не справимся!"
 red_spy_in_the_base: "Саботировать производство"
 destroy_capital: "Спровоцировать несчастный случай"
 destroy_capital_desc: "Выразим свои соболезнования пострадавшим рабочим, они гибнут за правое дело!"
 sabotage_decision: "Ограбить склад"
 sabotage_decision_desc: "Не думаю, что там наверху сильно огорчатся, если со складов таинственным образом исчезнет пара десятков единиц вооружения."
 make_resistance_for_our_occupant: "Поднять недовольство в: [FROM.GetName]"
 make_resistance_for_our_occupant_desc: ""
 make_resistance_for_our_occupant2: "Поднять людей в: [FROM.GetName]"
 have_resistance_decision_flag: "Уже поднималось недовольство"
 GENERIC_newpeople: "Наш райский уголок"
 GENERIC_newpeople_desc: ""
 manpower_plus: "Люди из [FROM.GetName] бегут к нам"
 manpower_plus_desc: "Нет лучшего места для жизни, чем наша держава - это понимают все."
 GENERIC_helping_others: "Спасение утопающих"
 deal_for_defender: "Предложить спасение: [FROM.GetName]"
 deal_for_defender_desc: "[FROM.GetName] держутся храбро, но очевидно им не устоять перед натиском врага. Мы можем предложить им убежище, выделив часть своей территории."
 deal_for_defender_tt: "\nОдин из наших регионов будет отдан стране [FROM.GetName]. [FROM.GetName] в свою очередь выйдут из всех текущих конфликтов.\n\nЕсли [FROM.GetName] имели субьектов, их вассалы перейдут под контроль оккупантов."
 make_resistance_for_our_occupant2_desc: "Пришла пора взяться за оружие и защищать [FROM.GetName] как свой родной дом. Чёрт возьми, да это и есть родной дом!"
 we_leave_from_this_shit_tt: "Мы подпишем мир с каждой страной, находяшейся в состоянии войны с нами и переедем на новую территорию. Все старые регионы отойдут под контроль оккупантов.\n\nМы выйдем из альянса, а все наши марионетки станут вассалами оккупантов."
 lobbe_our_opinion: "Лоббирование своих интересов"
 lobbe_our_opinion_desc: "Про нас ни в коем случае не должны забыть, и для этого необходимо постоянно выступать с заявлениями и напоминать о себе и своих проблемах. Благо один из наших союзников предлагает для этого достойную трибуну. Предлагает же?"
 discritisation: "Дискредитировать оккупанта"
 discritisation_desc: "Враг пытается легетимизировать свою власть на нашей земле, но мы ему не позволим. Наш голос правды будет звучать до тех пор, пока нам не вернут то, что принадлежит нам по праву!"
 buy_merceneryes: "Оплатить дивизии наёмников"
 buy_merceneryes_desc: "Солдаты удачи не спрашивают о чести, их интересует только звон монет. Если наших собственных сил недостаточно, мы наймем тех, кто готов проливать кровь за золото."
 not_dept_tt: "Нет большой задолженности"
 merceneryes_category: "Наёмники"
 merceneryes_category_desc: "Война — дорогое удовольствие, но поражение обойдется еще дороже. В этом мире всегда найдутся те, чье ремесло — битва, и чьи услуги можно купить, чтобы склонить чашу весов на нашу сторону."
 more_people: "Найти людей"
 more_people_desc: "Каждая пара рук — это кирпич в фундаменте нашей будущей победы. Мы должны отыскать и призвать каждого, кто еще способен держать в руках инструмент или винтовку."
 more_equipment: "Найти снаряжение"
 more_equipment_desc: "Солдат без снаряжения — это лишь мишень. Мы обыщем все склады и закрома, чтобы обеспечить наших защитников всем необходимым для грядущих сражений."
 more_pto: "Найти орудия пто"
 more_pto_desc: "Сталь и пламя — единственные языки, которые понимает вражеская бронетехника. Нам нужно больше орудий, способных превратить их хваленые танки в груду дымящихся обломков."
 more_guns: "Найти винтовки"
 more_guns_desc: "Винтовка — это сердце пехоты и последний аргумент в споре за свободу. Ни один наш боец не должен отправиться на фронт с пустыми руками."
 pay_depts: "Выплаты по задолженностям"
 pay_depts_desc: "Долги — это цепи, которые тянут нашу экономику на дно. Выплатив то, что причитается, мы вернем себе честное имя и полную свободу действий на мировой арене."
 close_borders: "Закрытие границ"
 close_borders_desc: "Мир полон хаоса, шпионов и угроз. Мы должны запереть двери нашего дома на все засов, чтобы уберечь наш народ и наши секреты от незваных гостей."
 more_paying: "Повышение зарплат"
 more_paying_desc: "Сытый рабочий — это преданный рабочий. Повышая жалованье, мы доказываем народу, что государство ценит их тяжелый труд и заботится об их благополучии в эти непростые времена."
 rasist_decision: "Организовать гонения на неместных"
 rasist_decision_desc: "Чистота наших рядов — залог непоколебимого единства. Те, кто не разделяет нашу кровь и культуру, лишь вносят раздор и готовят почву для предательства изнутри."
 freedom_decision: "Освободить часть повстанцев"
 freedom_decision_desc: "Милосердие может быть эффективным инструментом политики. Освобождая тех, кто осознал свои ошибки, мы демонстрируем свою мощь и превращаем вчерашних врагов в союзников."
 nonpopulation_decision: "Кампания по понижению рождаемости"
 nonpopulation_decision_desc: "Наши ресурсы не безграничны, и мы должны проявить мудрость. Ограничение роста населения сегодня позволит нам избежать голода и социального коллапса завтра."
 population_decision: "Кампания по повышению рождаемости"
 population_decision_desc: "Дети — это будущее нашей державы и новые поколения героев. Мы должны сделать всё, чтобы в наших городах звучало как можно больше детских голосов, наполняя страну жизнью."
 selebrate: "Отметить национальный праздник"
 selebrate_desc: "Нация, помнящая свои триумфы, непобедима. Пусть сегодня развеваются знамена и звучит музыка, напоминая каждому о величии нашей страны и единстве нашего народа!"
 nationalisation_industry_decision: "Национализация промышленности"
 nationalisation_industry_decision_desc: "На какое-то время мы должны будем изъять производство у собственников на благо государства. Нам потом за это спасибо скажут."
 farm_decision: "Расширить фермерские угодья"
 farm_decision_desc: "Золотые нивы — это фундамент нашей независимости. Мы превратим каждый свободный клочок земли в житницу, чтобы голод никогда не стал союзником наших врагов."
 bomzh_decision: "Пособия"
 bomzh_decision_desc: "Сильное государство познается по заботе о слабых. Протягивая руку помощи нуждающимся, мы покупаем их преданность и выбиваем почву из-под ног уличных подстрекателей."
 state_deal: "Промышленность за: [FROM.GetName]"
 factory_deal: "Предложить перенести производство: [FROM.GetName]"
 factory_deal_desc: "Промышленный обмен — это высшая форма дипломатии. Перенос наших мощностей на территорию [FROM.GetName] свяжет их экономику с нашей невидимыми, но прочными цепями."
 NATIONALISATION_category: "Политика мороженого в действии"
 addcore_decision: "Задобрить [FROM.GetName]"
 addcore_decision_desc: "Улучшив отношения с [FROM.GetName], мы сумеем избежать войны."
 docy_deal: "Предложить перенести доки: [FROM.GetName]"
 docy_deal_desc: "Тот, кто владеет доками, владеет горизонтом. Расширение нашего присутствия в портах [FROM.GetName] обеспечит нам господство на торговых путях и логистическое преимущество."
 docy_deal_tt: "Из региона, в который будет перенесена иностранная фабрика, больше нельзя будет продавать промышленность кому-либо ещё."
 wait_for_result_of_deal_about_states_flag: "Ожидается результат сделки"
 state_deal_desc: "В большой игре за влияние промышленность — такая же валюта, как и золото. Эта сделка закрепит наши интересы в регионе и сделает [FROM.GetName] зависимыми от наших технологий."
 ice_help_decision: "Наладить отношения со снежными"
 ice_help_decision_desc: "Холод Снежного королевства не должен быть преградой для большой политики. Мы найдем общие интересы даже в вечных льдах, превратив мороз в наш стратегический актив."
 GENERIC_constitution_decisions: "Наша конституция"
 GENERIC_constitution_decisions_desc: "Конституция — это не просто бумага, а священный договор между лидером и народом. Она должна служить щитом для порядка и мечом против анархии."
 constitution_decision1: "Внесение поправок"
 constitution_decision1_desc: "Времена меняются, и основной закон должен меняться вместе с ними. Мы внесем правки, которые укрепят вертикаль власти и адаптируют державу к новым вызовам."
 constitution_decision2: "Показательный процесс защиты прав"
 constitution_decision2_desc: "Пусть весь мир видит: в нашей стране закон стоит на страже справедливости. Этот процесс станет уроком для всех, кто сомневается в легитимности нашего строя."
 constitution_decision3: "Отметить день конституции"
 constitution_decision3_desc: "Сегодня день нашего единства под сенью закона. Громкие торжества напомнят каждому гражданину, что его права и обязанности — это то, что делает нас великой нацией."
 GENERIC_people_need_it_decision: "Предъявить требования: [FROM.GetName]"
 GENERIC_people_need_it_decision_desc: "Глас народа — это требование самой истории. Мы выдвигаем [FROM.GetName] условия, за которыми стоит воля миллионов, и игнорировать их будет роковой ошибкой."
 propaganda_decision: "Пропагандистская кампания"
 propaganda_decision_desc: "Победа куется не только на фронте, но и в умах. Мы заполним эфир и газеты правдой, которая воодушевит верных и заставит сомневающихся склонить головы."
 cult_of_person_decision: "Культ личности"
 cult_of_person_decision_desc: "Наш лидер шикарен во всём, и он готов это продемонстрировать."
 claim_decision: "Выдвинуть претензии на [FROM.GetName]"
 claim_decision_desc: "История не прощает забывчивости. Земли [FROM.GetName] всегда принадлежали нам по праву крови и предков, и пришло время официально заявить об этом всему миру." 
 claim_decision_tt: "Требование земель союзника негативно скажется на поддержке режима."
 change_ideology_category: "Борьба с инакомыслием"
 start_company_neutral: "Начать противоэлементную кампанию"
 start_company_candy: "Начать кампанию сласти"
 start_company_candy_desc: "Сладость и порядок должны стать девизом каждого дома. Мы искореним горечь пораженчества, насаждая культуру радости и абсолютной лояльности конфетным идеалам."
 start_company_neutral_desc: "В борьбе за будущее нет места радикалам. Мы очистим политическое поле от деструктивных элементов, возвращая страну на путь прагматизма и спокойного созидания."
 start_company_ice: "Начать ледяную кампанию"
 start_company_ice_desc: "Ледяная дисциплина должна сковать ряды наших граждан. Мы заморозим любые ростки неповиновения, создав общество, столь же прочное и чистое, как арктический лед."
 start_company_fire: "Начать кампанию огня"
 start_company_fire_desc: "Огонь очищения сожжет всё старое и немощное. Эта кампания закалит наш народ в пламени идеологической ярости, превращая страну в несокрушимый горн."
 start_company_slime: "Начать кампанию слизи"
 start_company_slime_desc: "Гибкость и единство — вот наши инструменты. Кампания слизи научит народ проникать в любые щели и обволакивать врага, становясь единым, неразрывным организмом."
 start_street_crash: "Забастовки на работе"
 start_street_crash_desc: "Смутьяны и бездельники пытаются остановить работу наших заводов. Мы должны немедленно пресечь этот саботаж, пока бацилла забастовок не парализовала все государство."
 use_army: "Использовать армию для подавления"
 use_army_desc: "Когда дипломатия бессильна, тишину на улицах должен навести лязг гусениц. Армия — последний и самый надежный аргумент в защите государственного порядка."
 ban_decision: "Запретить оппозицию"
 ban_decision_desc: "Многоголосие оппозиции — это лишь шум, мешающий движению вперед. Мы запретим тех, кто сеет раздор, ради высшей цели — нерушимого единства нации."
 influence_on_army: "Повлиять на армию"
 influence_on_army_desc: "Генералы должны знать, на чьей стороне правда и сила. Мы укрепим связи с офицерством, чтобы в час испытаний мечи армии были направлены только в сторону наших врагов."
 influence_on_army_tt: "С началом гражданской войны у нас будет на 250 единиц пехотного снаряжения больше."
 influence_on_army_tt_2: "С началом гражданской войны под нашим контролем будут все регионы, кроме столичного."
 main_solution: "Судьбоностный шаг"
 main_solution_desc: "Мы стоим на пороге великих свершений. Этот шаг определит облик нашей державы на десятилетия вперед — назад пути нет, только к триумфу или вечному забвению."
 volunters_decision: "Собрать миротворцев для: [FROM.GetName]"
 volunters_decision_desc: "Когда огонь войны охватывает земли наших соседей, мы не можем оставаться в стороне. Мы отправим тех, кто готов принести мир на острие меча, чтобы защитить [FROM.GetName] от неминуемой гибели."
 volunters_decision2: "Собрать миротворцев для: [FROM.GetName]"
 volunters_decision2_desc: "Стабильность в регионе — это залог нашей собственной безопасности. Наши добровольцы станут тем щитом, который сдержит хаос и поможет [FROM.GetName] выстоять в этот темный час."
 volunters_decision3: "Собрать миротворцев для: [FROM.GetName]"
 volunters_decision3_desc: "Судьба [FROM.GetName] неразрывно связана с нашей. Мы призываем лучших сынов отечества встать на защиту общих идеалов, ведь если падет один из нас, под угрозой окажутся все."
 volunters_decision_tt: "\nОтправить в [FROM.GetName] контингент своих солдат."
 kick_member3: "Выгнать: [FROM.GetName]"
 kick_member3_desc: "Это будет не простое голосование"
 kick_member: "Выгнать: [FROM.GetName]"
 kick_member_desc: "Это будет не простое голосование"
 kick_member2: "Выгнать: [FROM.GetName]"
 kick_member2_desc: "Это будет не простое голосование"
 PBB_explain_control_tools: "Показательное задержание"
 PBB_explain_control_tools_desc: "Нет ничего постыднее для отступника от закона, чем всенародное порицание и закидывание тухлыми яйцами."
 PBB_explain_control_tools_ttt: "\nЭффект улучшиться после выполнения фокуса §YВраги внутри§!"
 decision_hol_radio_oranje: "Установка новой камеры"
 decision_hol_radio_oranje_desc: "Нам никогда не помешают лишние глаза."
 PBB_explain_control_tools2: "Прослушка подозреваемых"
 PBB_explain_control_tools2_desc: "Дополнительные уши нужны, особенно при наличии подозреваемых"
 PBB_explain_control_tools3: "Расширение инфраструктуры бананогвардии"
 PBB_explain_control_tools3_desc: "Дополнительные объекты для бананогвардии сделают их службу для нас более эффективной. "
 wartime_category: "Военное время"
 longwar_mission: "Усталость от войны"

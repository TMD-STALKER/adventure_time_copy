l_russian:
  #FHL
  stw.1.t: "Обнаружена угроза"
  stw.1.d: ""
  stw.1.a: "Мы позовём на помощь героев"
  stw.1.b: "Мы не отступим от своего!"
  stw.1.c: "Скорее бы они ушли"
  stw.2.t: "Семья Стенли в безопасности"
  stw.2.d: "пук"
  stw.2.a: "Для арбуза он как-то слишком часто попадает в неприятности"
  stw.3.t: "Пограничный конфликт"
  stw.3.d: "Обстановка на границе с Арбузией выходит из под контроля"
  stw.3.a: "Вот те на"
  stw.4.t: "Новый монарх огня"
  stw.4.d: "Арбузия удивляет"
  stw.4.a: "Поприветствуем же его"
  stw.5.t: "Новый монарх льда"
  stw.5.d: "Арбузия удивляет"
  stw.5.a: "Поприветствуем же его"
  stw.6.t: "Новый монарх слизи"
  stw.6.d: "Арбузия удивляет"
  stw.6.a: "Поприветствуем же его"
  stw.7.t: "[FROM.GetName] требует защиты"
  stw.7.d: "[FROM.GetName] опасаются того, что их соседи затевают не доброе"
  stw.7.a: "Мы должны защищать своих"
  stw.7.b: "Здесь мы бессильны"
  stw.8.t: "[FROM.GetName] представляет угрозу нашей безопасности"
  stw.8.d: "Зря они пошли по этому скользкому пути"
  stw.8.a: "Нам просто не оставили другого выбора"
  stw.9.t: "[FROM.GetName] хочет провести совместный научный форум"
  stw.9.d: "Оказывается многие учёные - те ещё овощи"
  stw.9.a: "Нет причин для отказа"
  stw.9.b: "Это слишком неожиданно"
  stw.10.t: "Научный форум"
  stw.10.d: "Так. Кто изобрёл эту штуковину? Хм. Ладно"
  stw.10.a: "Это было познавательно"
  stw.11.t: "[FROM.GetName] желает наладить торговлю"
  stw.11.d: "Магические фрукты и овощи. В этом что-то есть..."
  stw.11.a: "Нет причин для отказа"
  stw.11.b: "Это слишком неожиданно"
  stw.12.t: "Декларация места под солнцем"
  stw.12.d: "Мы официально закрепляем в конституции своё право на лучшую жизнь. Это означает, что мы достойны большего и возьмём то, что принадлежит нам по праву. То, что должно принадлежать нам по праву. А каждый, кто не захочет признавать нашу декларацию, перестанет существовать как независимый субьект политики УУУ."
  stw.12.a: "Вперёд, товарищи!"
  stw.13.t: "[FROM.GetName] взывает к нам"
  stw.13.d: "Сейчас [FROM.GetName] ведёт, практически, священную войну против своих соседей за право существовать в этом мире на равных с остальными. К нам поступило предложение поддержать дружественное нам государство, объявив войну его врагам. Мы не подписывали ранее никаких договоров, обязывающих нас присоединяться к этому, однако будет крайне бесчестно не поддержать союзника в трудный для него момент."
  stw.13.a: "Мы не можем не поддержать их"
  stw.13.a: "Вы чё?! Ёбнулись?!"
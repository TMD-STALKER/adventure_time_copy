l_russian:
  #FAJ
  faj.1.t: "[FROM.GetLeader] готовит научное барбекю"
  faj.1.d: "Совсем скоро принцесса Бубльгум проведёт важнейшее в научном сообществе мероприятие. Герой Финн был приглашён как особый гость, который также должен будет поделится каким-то своим открытием. Умнейшие из умнейших соберутся, чтобы поделится своими умными штуками, а у нас только макет империи сластей из собственной слюны. И тот уже сдулся. Это никуда не годится. Нужно в кротчайшие сроки придумать что-то опупеть какое умное, чтобы поразить всех на барбекю, но как?"
  faj.1.a: "Надо впечатлить принцессу!"
  faj.1.b: "Это слишком сложно. Мы откажемся от выступления."
  faj.2.t: "Принцесса завела опасные знакомства"
  faj.2.d: "Рикардио, таинственный парень в форме сердца, вскружил голову Бубльгум своими познаниями в науке. Теперь она предпочитает проводить всё свободное время за беседами с ним, вместо наших прежних встреч. Это так не правильно! У принцессы всё это время были верные герои, готовые на всё ради неё, а она так просто променяла наши отношения на кого-то совсем чужого и крайне подозрительного. Да, у них много общих тем для разговора, но с друзьями так не поступают, их не вытесняют появившиеся из не откуда незнакомцы. Или всё так как должно быть? Что, если все подозрения в худшем, это не более чем ревность? Что если нам просто нужно больше доверия друг к другу?"
  faj.2.a: "Мы должны остановить Рикардио любой ценой"
  faj.2.b: "Это не наше дело"
  faj.3.t: "Таинственное подземелье"
  faj.3.d: "[FROM.GetLeader] поручила нам миссию по исследованию подземелья под старой рощей конфетных деревьев. Один из пней оказался старым люком, видимо ещё довоенных времён. Люк привёл нас к чему-то напоминающему бескрайнюю подземную свалку. Казалось бы - ничего примечательного. До тех пор, пока среди Холодильников и покрышек не показались чьи-то глаза. Это... Люди?! Нет, не может быть! Но в любом случае мы должны прямо сейчас сделать судьбоносный выбор. Идти ли нам на контакт с неизвестными подземными существами?"
  faj.3.a: "Вперёд в неизвестность!"
  faj.3.b: "Они слишком опасны"
  faj.4.t: "Победа за героями"
  faj.4.d: "Разящий свет прогресса ослепил и обезоружил неподготовленный подземный народ. Эти дикари не сумели ничего противопоставить нам. Есть неприятное последствие в виде пожара. Тем не менее, жители поверхности одержали вверх в этой битве."
  faj.4.a: "Ура!"
  faj.4.b: "Б-б-бежим!"
  faj.5.t: "[FHL.GetName] победили!"
  faj.5.d: "Шокированные увиденным, герои с поверхности не смогли ничего противопоставить народу подземелья. Одолеть кого-то на его территории оказалось сложнее, чем планировалось. Нам придется отказаться от наших изначальных планов."
  faj.5.a: "Нужно спасаться как можно скорее"
  faj.5.b: "Вместе. Мы. Сила!"
  faj.6.t: "Чудеса поверхности"
  faj.6.d: "[FHL.GetLeader] и остальные [FHL.GetName] достойны жить с нами, это факт. Мы поделились с новыми людьми всем, что знали, научили жить и показали им как прекрасна может быть жизнь. И сейчас, сидя у костра и обдумывая всякое, кажется будто это всё начало чего-то большего и прекрасного, и нам остаётся только идти в это счастливое будущее вместе. Да, так и должно быть."
  faj.6.a: "Верим?"
  faj.7.t: "Принцесса просит отомстить, но есть нюанс"
  faj.7.d: "Недавно, по нашей глупости, по внешности принцессы был нанесён серьёзный удар, и прямо на кануне большой встречи знати УУУ. [FROM.GetLeader] в ярости и подозревает в содеянном виновен [NUT.GetLeader] как тот, кто уже очень давно доставляет принцессе неудобства. От нас требуется нанести ореху визит и заставить его заплатить за свой проступок. Но есть проблемка... Мы сами виноваты в случившемся, когда играли бутылками, в которых находились отходы. Одну из таких мы случайно забросили прямо в покои принцессы. И что нам теперь делать? Не говорить же ей прямо в лицо, что это мы сотворили такой ужас? А может [NUT.GetLeader] сам по природе гнилой и если повесить на него очередное преступление, с него не убудет?"
  faj.7.a: "Посмотрим, что [NUT.GetLeader] за человек"
  faj.7.b: "Надо сознаться"
  faj.8.t: "[NUT.GetLeader] злодей?"
  faj.8.d: "Мы отправились с визитом с [NUT.GetName], чтобы разузнать что-нибудь об обвиняемом. Затем, после непродолжительной погони, мы наконец встретились с объектом ненависти принцессы, переговорили и выяснили, что он... Не плохой? [NUT.GetLeader] не создаёт впечатление личности, способной на злодеяние или достойной хотя бы части той ненависти, что испытывает [PBB.GetLeader]. Как же нам быть? Мы стоим перед моральным выбором, отдать орех принцессе на растерзание, сохранив её веру в героев, либо сознаться уже наконец во всём и получить соразмерное наказание. За покушение на здоровье монарха сластей нам, возможно, придётся расплачиваться всю жизнь. Но [NUT.GetLeader] ни в чём не виноват."
  faj.8.a: "Мы не можем обвинить его"
  faj.8.b: "Нельзя, чтобы принцесса разочаровывалась в своих героях"
  faj.9.t: "Заговор против нас"
  faj.9.d: "Недавно с монархом империи сластей случилось страшное несчастье. Лик принцессы был обезображен прямо на кануне важного съезда правителей УУУ, и в этом обвиняют нас. Каким-то образом, в этой истории оказался замешен [ROOT.GetLeader], что является вздором и вбросом вопиющей наглости. Принцесса наняла героев для проведения расследования... Или, что гораздо вероятнее, чтобы покарать нас за все годы сомнительных отношений. Да, связи между орехами и конфетами никогда не были простыми, но мы бы никогда не осмелились на преступление против короны - чтобы там себе не придумывала [FROM.GetLeader]. Но сейчас уже поздно доказывать свою невиновность. В приграничные регионы уже введены войска и их мы потеряли, а часть знати подняла восстание и присодинилась к карательному отряду героев. Сейчас наш последний шанс отстоять свой суверенитет и правду!"
  faj.9.a: "За что нам всё это?"
  faj.10.t: "[FROM.GetLeader] защищает Рикардио"
  faj.10.d: "Мы ничего не можем поделать, принцесса строго против того, чтобы мы подозревали Рикардио. А слово [FROM.GetLeader] - закон для нас."
  faj.10.a: "Хоть бы она знала, что делает"
  faj.11.t: "[FROM.GetLeader] хочет, чтобы мы доставили пироги"
  faj.11.d: ""
  faj.11.a: "Мы пойдём безопасной дорогой" 
  faj.11.b: "Надо обхитрить похитителей"
  faj.11.c: "Пирогов достойны только мы" 
  faj.12.t: "Церемония удалась"
  faj.12.d: "Все пироги были доставлены в целости и сохранности, а сама церемония чесания спин была подготовлена на высшем уровне. Идеальные пироги своим вкусом доказали свое название. Воистину, этот вечер ничто не испортит!"
  faj.12.a: "Это было великолепно"
  faj.13.t: "Герои несут пироги
  faj.13.d: "Сидя голожжными у костра, мы заметили, что на нашу территорию попали два чужеземца. Однако это не так важно по сравнению с тем, что они несут с собой. Похоже, что это те самые идеальные пироги. Стоит ли нам попытаться забрать такую лакомую добычу себе и решить вопрос с обедом и ужином или лучше не рисковать?"
  faj.13.a: "У НИХ ЕСТЬ ПИРОГИ?!"
  faj.13.b: "Выглядит как ловушка"
  faj.14.t: "[FROM.GetName] присвоили себе пироги" 
  faj.14.d: "Шокирующие новости! Оказалось, что герои, которых мы наняли для доставки пирогов на церемонию, вместо того, чтобы их доставить, совершили немыслимое – они их присвоили себе! От кого-кого, а от них такой подлости мы не ожидали."
  faj.14.a: "Возмутительно!"
  faj.15.t: "Часть пирогов украли"
  faj.15.d: "Это была удачная вылазка! Эти двое оказались такими простофилями, что по собственной невнимательности они забыли о своих пирогах, чем мы с большим удовольствием и воспользовались. Теперь их пироги – это наши пироги."
  faj.15.a: "Это [FROM.GetName]!"
  faj.15.b: "Сегодня шикуем" 
  faj.16.t: "Атака на пироги отражена" 
  faj.16.d: "Похоже, что сегодня у нас не будет не будет ужина. Мало того, что пироги нам не достались, так еще мы получили множественные синяки. Определенно, сегодня не наш день."
  faj.16.a: "[FROM.GetName] получили по заслугам"
  faj.16.b: "Отстой" 
  faj.17.t: "Мы сохранили большинство пирогов"
  faj.17.d: "После столкновений мы сумели сохранить наши пироги от грязных лап бандитов. Конечно, они забрали часть, но не беда – большая их часть теперь под нашим присмотром"
  faj.17.a: "Принцесса будет довольна"
  faj.18.t: "Мы потеряли большинство пирогов"  
  faj.18.d: "Это ужасный день! Бандиты сумели нас одолеть, но что еще хуже – они забрали почти все пироги. Наша самонадеянность привела к тому, что принцессе отрубят голову на церемонии. Что теперь делать?"
  faj.18.a: "Принцесса вряд ли будет довольна"
  faj.19.t: "Справились, но так себе"
  faj.19.d: "История с пирогами подходит к концу. [FAJ.GetRulingPartyLong] выполнили просьбу принцессы крайне... Интересным образом. Решив, что пироги обязательно попытаются украсть в момент их доставки на церемонию, [FROM.GetLeader] намеренно выбирает самую опасную дорогу, как «наиболее неожиданную» для потенциальных грабителей. Как результат, пироги были похищены тогда, когда герои привлекли к себе внимание. К счастью, параллельно со своим гениальным походом, герои снарядили пирогами и отправили по безопасной дороге булку с корицей, и вот уже он сумел доставить пироги на церемонию вовремя."
  faj.19.a: "Хорошо, что всё обошлось"
  faj.20.t: "[FROM.GetLeader] доверила нам оцепление подземелья"
  faj.20.d: "[FROM.GetName] обеспокоено обнаруженным подземельем и просит нас, как верных союзников империи, заняться оцеплением территории. От нас требуется не к коем случае не пытаться исследовать столь опасное место, и просто расставить вокруг заграждения и знаки опасности. Задание довольно простое."
  faj.20.a: "А может всё таки..."
  faj.20.b: "Просто сделаем, что она просит"
  faj.21.t: "Первый уровень подземелья"
  faj.21.d: "Ужасный зверь преградил дорогу и почти готов с нами расправится. Он почти знает имя наглеца, что вторгся в его владения, почти знает его слабости и почти знает как расправится с ним. Зверь подземелья был уже почти готов наброситься на вторженца, как вдруг учуял в нём запах угрозы и замешкался. Некто близкий оставил на госте подземелья свой запах, крайне неприятный зверю."
  faj.21.a: "Есть шанс сбежать"
  faj.22.t: "Второй уровень"
  faj.22.d: "На пути массивная магическая дверь. Нашими силами её не разрушить"
  faj.22.a: "Тут бы пригодились навыки взлома"
  faj.23.t: "[ROOT.GetLeader] умирает"
  faj.23.d: "Пустошь... Тьфу ты. Подземелье поглотило вас."
  faj.23.a: "Это конец"
  faj.24.t: "Ключ так близко"
  faj.24.d: "Огромный слизень всосал в себя ключ и теперь его достанет разве что... Знакомый путника, всегда готовый к таким ситуациям. Мда уж..."
  faj.24.a: "И так далеко"
  faj.25.t: "Третий уровень"
  faj.25.d: "Огромный воин требует битвы с ним. Но лучше убраться от сюда как можно скорее"
  faj.25.a: "Мал, да удал"
  faj.26.t: "Четвёртый уровень"
  faj.26.d: "Зверь с верхнего этажа, который ранее был напуган запахом могущественного товарища вторженца, теперь знает что путник совсем один и беззащитен, а значит настала пора покончить с ним"
  faj.26.a: "Снова он, только не это"
  faj.27.t: "Пятый уровень"
  faj.27.d: "Ангел спустилась с небес, чтобы спасти заблудшую душу... Вот только и это оказалось ловушкой подземелья, которое собирается забрать ещё одну жизнь."
  faj.27.a: "Кругом обман!"
  faj.28.t: "Последний уровень"
  faj.28.d: "Инфернальные глаза, дышащие огнём, готовятся расправится с нами. Справится ли герой подземелья с этим?"
  faj.28.a: "Всё или ничего"
  faj.29.t: "Спасение в последний момент"
  faj.29.d: "Пусть подземелье и не было запечатано, как того изначально хотела принцесса, пусть недра этого места и были разгневаны, всё же главное -  все живы здоровы. Никто ещё никогда так не радовался появлению гигантской птицы. Был получен бесценный опыт, но теперь пора выбираться от сюда"
  faj.29.a: "О мой Глоб"
  faj.30.t: "Справочник героя" 
  faj.30.d: "После очередного спасения, принцесса позвала героев к себе в башню, чтобы поведать о легендарном артефакте – справочнике Энхиридионе, принадлежавшем некогда славному герою прошлого, Билли. Эта книга хранится в районе горы Крагдор. Лишь истинные герои смогут получить этот великий справочник."
  faj.30.a: "Мы обязаны его достать!"
  faj.31.t: "Столкновение интересов"
  faj.31.d: "Находясь в деревне любителей кулачных боев, герои услышали плач горы. Слезы в виде валунов текли из-за постоянного насилия, которое гора вынуждена смотреть. Что делать героям в этой ситуации?"
  faj.31.a: "Вряд ли мы в силах решить эту проблему"
  faj.31.b: "Мы можем попытаться договориться с частью жителей"
  faj.31.c: "Должно быть решение, которое устроит всех!"
  faj.32.t: "Герои пускают всё на самотёк"
  faj.32.d: "Эти двое, которые гордо именуют себя героями, оказались настоящими болванами! Жители не могут подраться от души, гора расстороена, мужик голый - все не получили то, о чем их просили! Даже элементарное - почесать спинку дракону - и то не смогли! Ужас!"
  faj.32.a: "Мы решим проблемы более простым способом"
  faj.33.t: "Герои решают не все проблемы"
  faj.33.d: "Несмотря на попытки героев нам помочь, они справились только с некоторыми проблемами. Не все осчастливлены действиями героев, конечно, но уж лучше так, чем ничего."
  faj.33.a: "Ладно, дальше мы как-нибудь сами"
  faj.34.t: "Герои решают все проблемы" 
  faj.34.d: "Наконец-то, спустя столько лет, каждый получил то, чего хотел! Теперь жители занимаются любимыми делами, при этом, не мешая другим. Мы бы не справились с проблемами, не будь Финна и Джейка, за что им большое спасибо!"
  faj.34.a: "Ура!"
  faj.35.t: "[FROM.GetLeader] уделяет внимание" 
  faj.35.d: "Сегодня к Леди Ливнерог пришел со своей виолой дорогой ее сердцу кавалер - Джейк! Этот милый пес пришел, чтобы провести с ней весело время и поиграть на своем инструменте сви великолепные мелодии."
  faj.35.a: "Как мило с его стороны"
  faj.35.b: "Нам следует его опасаться"
  faj.36.t: "[ROOT.GetLeader] и [FROM.GetLeader] отличная пара" 
  faj.36.d: " Джейк и Леди Ливнерог так весело проводят вместе друг с другом. Они прекрасно понимают друг друга. Кажется, они живут на этом белом сете только ради друг друга. Уверен, у этой парочки большое будущее."
  faj.36.a: "Вместе мы добьёмся многого"
  faj.37.t: "[FROM.GetName] настроен враждебно" 
  faj.37.d: "Как бы странным это не казалось, но Леди предпочла дистанцироваться от Джейка. Похоже, что она на данный момент она не заинтересована в том, чтобы нынешняя дружба развилась в нечто большее."
  faj.37.a: "Вот уж не ожидали"
  faj.38.t: "Финн или [FROM.GetLeader]?!" 
  faj.38.d: "Перед нами два стула: на одном брат не по крови, но по духу – Финн. На другом – любовь всей жизни, Леди Ливнерог. Каждому нужно уделить внимание и провести с ним время, но делать это одновременно так сложно. Что же делать?"
  faj.38.a: "Надо найти способ подружить их" 
  faj.38.b: "Братья должны держаться вместе" 
  faj.38.c: "Финну придётся смириться с новым соседом" 
  faj.39.t: "Финн и [FROM.GetLeader] слишком дружны!" 
  faj.39.d: "После того, как был преодолен языковой барьер между Финном и Леди Ливнерог, Джейк как будто отошел на второй план. Теперь эти двое проводят все свободное время. Все идет совсем не так, как это представлялось в голове."
  faj.39.a: "Наверное, с этим ничего не поделать"
  faj.39.b: "Надо отплатить Финну той же монетой!"
  faj.40.t: "Мир, дружба и Тиффани" 
  faj.40.d: "После небольшой откровенной беседы все встало на свои места. На самом деле, друзья Джейка вовсе не хотели его оставлять в одиночестве. Они просто хотели больше дружить, как того и хотел Джейк. Слава Глобу, что все это недоразумение закончилось."
  faj.40.a: "Глупо было переживать"
  faj.41.t: "[FROM.GetName] разрывают связи" 
  faj.41.d: "Такого жестокого удара Леди не ожидала! Так еще и от Джейка... Он поступил бесчестно с Леди Ливнерог, заявив, что его брат намного важнее, чем она. И это после стольких свиданий! Теперь ее сердце разбито! Похоже, что мирного сосуществования псов и ливнерогов не будет"
  faj.41.a: "Предательство!"
  faj.42.t: "В королевстве пупырок" 
  faj.42.d: "В Конфетном королевстве проходила славная зефирно-чайная церемония, на которую были приглашены Финн, Джейк, ППК и другие гости. Были трудности у многих, но это неудивительно, ведь ей обучаются годами. Но на сей раз случилось происшествие. Во время прыгания по зефиру, ППК укусила Джейка за ногу, отчего тот стал превращаться в пупырку. Если не поторопиться до полуночи, то трансформация станет необратимой. "
  faj.42.a: "Нужно торопиться"
  faj.42.b: "Хорошо, подождём"
  faj.43.t: "Джейк на вечеринке пупырок" 
  faj.43.d: "От местных пупырок удалось получить волшебный шарик, который может обратить вспять пупырки. Но есть беда - брат Джейк полностью потерял свою личность, став этой высокомерной пупырчатой гадиной. Теперь он веселится на вечеринке, что находится под нами в районе бездны. Спускаться туда на транспорте слишком долго. Единственное, что остается - совершить прыжок веры туда. Конечно, есть большой риск погибнуть при прыжке, но Джейк должен быть спасен."
  faj.43.a: "Ради брата!"
  faj.43.b: "Безнадёжно. Джейку уже не помочь"
  faj.43.c: "Это ППК во всём виновата!"
  faj.44.t: "Джейк сопротивляется"
  faj.44.d: "Слава Глобу, мы добрались до этого бала! Джейк тоже нашелся. Но он... он не хочет садиться на шарик. На все мольбы и просьбы он отвечает полным безразличем."
  faj.44.a: "Он сядет на этот чёртов шар!"
  faj.44.b: "Ну и пусть катится к пупырковой матери"
  faj.45.t: "В пончиковом саду" 
  faj.45.d: "В поисках лягушки с короной, Финн и Джейк оказались в сад, полном пончиков и кексов. Джейк решил использовать свой острый нюх, чтобы проверить сад, как вдруг появилась хозяйка сада. Эта ведьма обвинила его в съедении пончиков. Джейк отрицал это, но... эх, Джейк... Эта старая карга отобрала его волшебные силы и не вернет их, пока он не извинится перед ней. "
  faj.45.a: "Пусть Джейк просто извинится"
  faj.45.b: "Мы вернём силы по-своему"
  faj.46.t: "Беда и подсознание" 
  faj.46.d: "Странствуя по Ууу в поисках волшебной лужи, герои наткнулись на мусорную реку, где жила самая ужасная русалка из всех ужасных русалок, каких только видели они. Она одолела Финна и понесла в гнездо на корм своим деткам, а Джейку подсознание напомнило слова ведьмы насчет возращения сил в обмен на извинения."
  faj.46.a: "Ладно, значит извинения"
  faj.46.b: "НИ. ЗА. ЧТО"
  faj.47.t: "Злостные нарушители" 
  faj.47.d: "Сегодня, во время ежедневной прогулки по саду, были обнаружены два непрошенных гостя. Мало того, что их никто сюда не звал, еще и этот желтый пес съел один из МОИХ пончиков. Ну значит, сейчас этот наглец получит по заслугам."
  faj.47.a: "МОИ ПОНЧИКИ!!!"
  faj.48.t: "Джейк танцует унизительный танец" 
  faj.48.d: "Вернувшись в сад, Джейк узнал, что время вышло. Теперь в дополнение к извинениям прилагается выполнение ряда унизительных действий, например, танец с собственным подсознанием. В конце концов, стоя в слезах перед хозяйкой сада и признав ошибки, наверное, Джейк понял все, за что можно силы и вернуть. "
  faj.48.a: "Хороший мальчик"
  faj.49.t: "Джейк стоит до конца" 
  faj.49.d: "Вернувшись сад, Джейк узнал, что время вышло. Теперь в дополнение к извинениям прилагается выполнение ряда унизительных действий, например, танец с собственным подсознанием. Но Джейк отказался это выполнять, ведь у него есть самоуважение. Ну что же, если ему силы не нужны, то это его выбор."
  faj.49.a: "Бессильный, но гордый"
  faj.50.t: "Океан страха" 
  faj.50.d: "В ходе погони за тритоном- вором модных сапог, на Финна, откуда не возьмись, напал страх океана. Джейк, как лучший друг, предложил заработать на нем... Шутка! Конечно, он обязательно поможет."
  faj.50.a: "Без океана нам будет лучше"
  faj.50.b: "У Джейка есть план"
  faj.50.c: "Они хотят крови Финна! Очевидно, никому нельзя доверять"
  faj.51.t: "Главное - сделать первый шаг" 
  faj.51.d: "Как Финн и просил, бороться со страхом начали с утра. У Джейка разработан трехэтапный план по решению проблемы. К сожалению, кроме побитого лица ничего не удалось достичь. Похоже, это не так просто... Ну ладно, раз Финн такой упертый, будет ему и шаг четвертый."
  faj.51.a: "Я думал шагов будет только три"
  faj.52.t: "Исследование океана" 
  faj.52.d: "Отыскав среди хлама чудом сохранившуюся подводную лодку, Джейк убедил Финна поплавать в ней по дну. Все шло хорошо, паника у Финна прекратилась, но потом опять - двадцать пять. Началась течь, паника у Финна, не вовремя активированный аварийный кран... Финн сумел выбраться на платформу, а Джейк остался под водой без сознания, из-за как раз таки крана. Что нам теперь делать - превозмочь страх и спасти друга или смириться с потерей?"
  faj.52.a: "Джейк!!!"
  faj.52.b: "Это слишком страшно"
  faj.53.t: "Страха нет?" 
  faj.53.d: "Да! Финн сумел найти в себе смелость и он погрузился на дно, где потом вытащил своего дорогого брата. Что же это значит? А это значит, что Финн оказался сильнее своего страха! Надо будет это отпраздновать."
  faj.53.a: "Это было здорово"
  faj.54.t: "Трясунчик" 
  faj.54.d: ""
  faj.54.a: "Возьмём его домой"
  faj.54.b: "Фу, что за мерзость?!"
  faj.54.c: "Принцесса кажется хотела поставить на ком-то опыты"
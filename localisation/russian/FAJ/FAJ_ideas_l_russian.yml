 FAJ_sword: "Меч героя"
 FAJ_overgold: "Горы золота"
 FAJ_overgold_desc: "За всё время у героев УУУ скопилось море золота, которое хранится в сокровищнице основания домика на дереве. Каждая монета - память о пережитом приключении. Но в то же время повод для недругов вторгнуться в наши земли."